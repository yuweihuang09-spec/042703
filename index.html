<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻開書 - 隨機占卜工具</title>
    <style>
        body {
            font-family: "Noto Sans TC", Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #f9f4e8 0%, #e7d5c6 100%);
            color: #3d322d;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.2rem;
            letter-spacing: 0.05em;
        }
        .book-wrapper {
            position: relative;
            width: 720px;
            height: 420px;
            margin: 30px auto 10px;
            perspective: 1500px;
        }
        .book {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
            transform-origin: left;
            filter: drop-shadow(0 18px 30px rgba(0,0,0,0.18));
        }
        .book.open {
            transform: rotateY(-145deg);
        }
        .input-row {
            margin: 24px auto 0;
            max-width: 650px;
        }
        .input-row input {
            width: 100%;
            border-radius: 999px;
            border: 1px solid rgba(115, 82, 62, 0.3);
            padding: 14px 18px;
            font-size: 1rem;
            outline: none;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
        }
        .input-row input:focus {
            border-color: #8b5e3c;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.08);
        }
        .book-shadow {
            position: absolute;
            inset: auto 20px 20px 20px;
            height: 80%;
            width: 60%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.08), transparent 55%);
            filter: blur(12px);
            z-index: -1;
        }
        .page {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.08);
        }
        .page.cover {
            left: 0;
            z-index: 5;
            background: linear-gradient(120deg, #f7ead3 0%, #f1dcc1 100%);
            border-right: 1px solid rgba(61,50,45,0.15);
            transform-origin: left;
            transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .book.open .page.cover {
            transform: rotateY(-160deg);
        }
        .page.inner {
            left: 0;
            z-index: 4;
            background: linear-gradient(120deg, #fef9f3 0%, #f2e5d4 100%);
            border-right: 1px solid rgba(61,50,45,0.12);
            transform: translateX(8px);
            box-shadow: inset 0 0 18px rgba(0,0,0,0.06);
        }
        .page.right {
            right: 0;
            z-index: 3;
            transform-origin: left;
            background: linear-gradient(120deg, #fffdf8 0%, #f7eee1 100%);
            border-left: 1px solid rgba(61,50,45,0.15);
        }
        .page.edge {
            left: 0;
            z-index: 2;
            background: linear-gradient(90deg, rgba(148, 113, 83, 0.15), rgba(148, 113, 83, 0.05));
            width: 42%;
            transform: translateX(16px);
            filter: blur(0.5px);
        }
        .page::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0.45), transparent 65%);
            pointer-events: none;
        }
        .page-content {
            position: absolute;
            inset: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .page-content h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
            letter-spacing: 0.08em;
        }
        .page-content p {
            font-size: 1.5rem;
            line-height: 1.8;
            color: #5a4b42;
            max-width: 320px;
        }
        .answer {
            margin-top: 20px;
            font-size: 2rem;
            font-weight: 700;
            color: #6d4f37;
            min-height: 3rem;
        }
        .button-row {
            margin-top: 20px;
        }
        button {
            border: none;
            border-radius: 999px;
            padding: 14px 30px;
            font-size: 1rem;
            background-color: #8b5e3c;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        button:hover {
            transform: translateY(-2px);
            background-color: #a16f45;
        }
        .note {
            margin-top: 18px;
            color: #5f5249;
            font-size: 0.95rem;
        }
        @media (max-width: 780px) {
            .book-wrapper {
                width: 100%;
                height: 320px;
            }
            .page-content p {
                max-width: 260px;
                font-size: 1.2rem;
            }
        }
        @media (max-width: 520px) {
            .book-wrapper {
                height: 260px;
            }
            h1 {
                font-size: 1.8rem;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>翻開書的占卜</h1>
        <p>在心裡默念你的問題，然後按下「翻開書」按鈕。答案會出現在書頁裡。</p>

        <div class="input-row">
            <input id="question-input" type="text" placeholder="在此輸入你的問題，或在心裡默念它" />
        </div>

        <div class="book-wrapper">
            <div class="book" id="book">
                <div class="page edge"></div>
                <div class="page edge" style="transform: translateX(24px); opacity: 0.9;"></div>
                <div class="page edge" style="transform: translateX(32px); opacity: 0.8;"></div>
                <div class="page inner">
                    <div class="page-content">
                        <h2>神秘占卜書</h2>
                        <p>這本書包含了10個可能的答案。輸入你的問題，然後開始翻頁尋找指引。</p>
                        <div class="page-number">封面</div>
                    </div>
                </div>
                <div class="page right">
                    <div class="page-content">
                        <h2>答案</h2>
                        <div class="answer" id="answer">請輸入問題並開始翻頁</div>
                        <div class="page-number" id="page-number">第 0 頁 / 10 頁</div>
                    </div>
                </div>
                <div class="page cover">
                    <div class="page-content">
                        <h2>神秘書封</h2>
                        <p>翻開這本書，讓它幫你找到直覺的答案。</p>
                    </div>
                </div>
            </div>
            <div class="book-shadow"></div>
        </div>

        <div class="button-row">
            <button id="oracle-button">翻開書</button>
            <button id="next-button" style="margin-left: 12px; background-color: #5a4539;" disabled>下一頁</button>
            <button id="cover-button" style="margin-left: 12px; background-color: #5a4539;">返回封面</button>
        </div>
        <p class="note">這只是用作思考引導的趣味工具，非真正預言。</p>
    </div>

    <script>
        const sentences = [
            "是的",
            "現在還不是時候",
            "你需要更多資訊",
            "相信直覺",
            "結果會出乎意料",
            "保持耐心",
            "這是個好機會",
            "重新評估你的選擇",
            "跟隨你的心",
            "改變即將到來"
        ];

        const questionInput = document.getElementById('question-input');
        const oracleButton = document.getElementById('oracle-button');
        const nextButton = document.getElementById('next-button');
        const coverButton = document.getElementById('cover-button');
        const answerDiv = document.getElementById('answer');
        const pageNumberDiv = document.getElementById('page-number');
        const book = document.getElementById('book');

        let currentPage = 0;
        let isBookOpen = false;

        function playFlipSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();
            oscillator.type = 'square';
            oscillator.frequency.value = 420;
            gain.gain.value = 0.12;
            oscillator.connect(gain);
            gain.connect(ctx.destination);
            oscillator.start();
            oscillator.stop(ctx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        }

        function openBook() {
            const question = questionInput.value.trim();
            if (!question) {
                answerDiv.textContent = '先輸入你的問題，或在心裡默念它。';
                return;
            }

            currentPage = 1;
            answerDiv.textContent = sentences[0];
            pageNumberDiv.textContent = `第 ${currentPage} 頁 / ${sentences.length} 頁`;
            book.classList.add('open');
            isBookOpen = true;
            oracleButton.disabled = true;
            nextButton.disabled = false;
            playFlipSound();
        }

        function nextPage() {
            if (!isBookOpen) return;

            currentPage = (currentPage % sentences.length) + 1;
            answerDiv.textContent = sentences[currentPage - 1];
            pageNumberDiv.textContent = `第 ${currentPage} 頁 / ${sentences.length} 頁`;
            playFlipSound();
        }

        function returnCover() {
            book.classList.remove('open');
            isBookOpen = false;
            currentPage = 0;
            answerDiv.textContent = '請輸入問題並開始翻頁';
            pageNumberDiv.textContent = '第 0 頁 / 10 頁';
            oracleButton.disabled = false;
            nextButton.disabled = true;
            questionInput.value = '';
            playFlipSound();
        }

        oracleButton.addEventListener('click', openBook);
        nextButton.addEventListener('click', nextPage);
        coverButton.addEventListener('click', returnCover);
    </script>
</body>
</html></content>
